# Compile l'APK Android de MemeDrop à chaque push touchant l'appli Android ou
# le renderer partagé, puis le publie dans la release "android-latest"
# (lien de téléchargement direct, sans compte GitHub).
name: Android APK

on:
  push:
    paths:
      - 'memedrop/android/**'
      - 'memedrop/overlay/src/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est préinstallé sur les runners ubuntu (ANDROID_HOME) ;
      # AGP télécharge lui-même la plateforme et les build-tools manquants.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Clé de signature privée : secrets ANDROID_KEYSTORE_BASE64 (le .p12 en
      # base64) et ANDROID_KEYSTORE_PASSWORD, à définir dans Settings →
      # Secrets and variables → Actions.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant (voir memedrop/README.md, section signature Android)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/memedrop-release.p12"
          echo "MEMEDROP_KEYSTORE=$RUNNER_TEMP/memedrop-release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MEMEDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p memedrop/android assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/memedrop-release.p12"

      - name: Rename APK + version.json
        run: |
          cp memedrop/android/app/build/outputs/apk/release/app-release.apk MemeDrop.apk
          # Lu par le bouton "mise à jour" de l'app (Updater.kt) : même
          # versionCode que celui compilé dans l'APK (GITHUB_RUN_NUMBER).
          NAME=$(grep -oP 'versionName = "\K[^"]+' memedrop/android/app/build.gradle.kts)
          echo "{\"versionCode\": $GITHUB_RUN_NUMBER, \"versionName\": \"$NAME\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: MemeDrop-apk
          path: MemeDrop.apk

      # Pré-release (pas "latest") : n'interfère pas avec l'auto-update
      # Windows, qui ne lit que la dernière release stable.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MemeDrop.apk version.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MemeDrop Android (dernière build)" \
            --notes "APK compilé automatiquement depuis \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Installe-le sur ton téléphone Android 8+ — voir le README. Si tu avais une version d'avant la 1.6.0, désinstalle-la d'abord (nouvelle signature)."
