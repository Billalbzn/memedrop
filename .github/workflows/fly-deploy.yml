# Déploie le bot sur Fly.io à chaque push sur main touchant memedrop/bot/
# (ou à la demande : Actions → "Bot deploy (Fly.io)" → Run workflow).
# L'image est construite avec le Docker du runner GitHub (--local-only) : le
# service de build distant de Fly exige un moyen de paiement enregistré.
# Secret requis : FLY_API_TOKEN (`flyctl tokens create deploy -a memedrop-bot`).
name: Bot deploy (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'memedrop/bot/**'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

# Jamais deux déploiements à la fois, et jamais un déploiement coupé en route
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memedrop/bot
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret FLY_API_TOKEN manquant (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --local-only --wait-timeout 300
