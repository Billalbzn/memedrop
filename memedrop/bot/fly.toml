app = "memedrop-bot"
primary_region = "cdg"

[build]

[env]
  PORT = "8765"
  DATA_DIR = "/app/data"

[mounts]
  source = "memedrop_data"
  destination = "/app/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
