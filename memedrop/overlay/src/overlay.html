<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MemeDrop overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    #stage {
      position: fixed; inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .anchor {
      position: absolute;
      width: 0; height: 0;
    }

    .drop {
      position: absolute;
      left: 0; top: 0;
      transform-origin: center;
      will-change: transform, opacity;
      filter:
        drop-shadow(0 30px 60px rgba(0,0,0,.55))
        drop-shadow(0 6px 12px rgba(0,0,0,.4));
      opacity: 0;
      animation:
        drop-in   420ms cubic-bezier(.18,1.2,.4,1) forwards,
        drop-bob  3s ease-in-out 420ms infinite;
    }

    .drop.leaving {
      animation: drop-out 380ms cubic-bezier(.5,0,.75,0) forwards;
    }

    .media-box {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    .drop img,
    .drop video,
    .media-box > div > svg,
    .media-box > div > div > svg {
      display: block;
      max-width: 38vw;
      max-height: 50vh;
      width: auto;
      height: auto;
      border-radius: 14px;
      background: #000;
    }

    /* Avatar bubble — circular profile picture above the meme */
    .avatar-bubble {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, #ff5e8a 0%, #ffb45e 100%) padding-box,
        linear-gradient(135deg, #ff5e8a 0%, #ffb45e 100%) border-box;
      padding: 3px;
      box-shadow:
        0 8px 22px rgba(0,0,0,.5),
        0 2px 6px rgba(0,0,0,.3);
      z-index: 3;
    }
    .avatar-bubble img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1a1226;
    }
    .avatar-bubble::after {
      content: attr(data-username);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, 4px);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      color: #fff;
      background: rgba(0,0,0,.7);
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,.35);
    }

    /* Caption — subtitle bar at bottom of media (or audio card) */
    .caption-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      width: 100%;
      padding: 10px 14px 14px;
      font-family: 'Impact', 'Arial Black', 'Anton', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(18px, 2.6vw, 40px);
      line-height: 1.08;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-align: center;
      color: #fff;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow:
        0 2px 4px rgba(0,0,0,.9),
        0 0 10px rgba(0,0,0,.7);
      background: linear-gradient(to top,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.35) 55%,
        rgba(0,0,0,0) 100%);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 2;
      animation: caption-rise 420ms cubic-bezier(.18,1.1,.4,1) 160ms backwards;
    }

    /* ──────────────────────────────────────────────────────────────────
       Audio drop — a slim card that ONLY shows who's playing what.
       No fake album art, no big visual; just identity + optional caption.
       Width sized to a max so a long caption can wrap nicely.
       ────────────────────────────────────────────────────────────────── */
    .audio-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 22px 16px;
      min-width: 200px;
      max-width: 380px;
      border-radius: 18px;
      background: linear-gradient(180deg,
        rgba(28, 20, 44, .92) 0%,
        rgba(20, 14, 32, .95) 100%);
      backdrop-filter: blur(8px);
      box-shadow:
        0 12px 40px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);
      border: 1px solid rgba(255,180,94,.18);
    }

    .audio-card .audio-username {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
      color: #fff;
      text-align: center;
      margin-top: 2px;
    }

    /* Animated speaker bars to make the card feel "alive" while audio plays */
    .audio-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 18px;
      margin-top: 4px;
    }
    .audio-bars span {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #ff5e8a, #ffb45e);
      animation: bars 900ms ease-in-out infinite;
    }
    .audio-bars span:nth-child(1) { animation-delay: 0ms;   height: 60%; }
    .audio-bars span:nth-child(2) { animation-delay: 120ms; height: 90%; }
    .audio-bars span:nth-child(3) { animation-delay: 240ms; height: 50%; }
    .audio-bars span:nth-child(4) { animation-delay: 80ms;  height: 80%; }
    .audio-bars span:nth-child(5) { animation-delay: 200ms; height: 65%; }

    /* Caption variant for audio cards — same look but as part of card flow */
    .audio-card .audio-caption {
      max-width: 100%;
      text-align: center;
      font-family: 'Impact', 'Arial Black', 'Anton', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 2vw, 28px);
      line-height: 1.1;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 1.5px #000;
      paint-order: stroke fill;
      text-shadow: 0 2px 6px rgba(0,0,0,.6);
      word-break: break-word;
      overflow-wrap: anywhere;
      margin-top: 4px;
    }

    /* When inside an audio-card, the bubble doesn't overlap from outside —
       it sits at the top of the card flow. Override the absolute positioning. */
    .audio-card .avatar-bubble {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
    }

    @keyframes drop-in {
      0%   { opacity: 0; transform: translate(-50%, calc(-50% - 80px)) rotate(-8deg) scale(.6); }
      60%  { opacity: 1; transform: translate(-50%, calc(-50% + 12px)) rotate( 2deg) scale(1.04); }
      100% { opacity: 1; transform: translate(-50%, -50%)              rotate( 0deg) scale(1);    }
    }
    @keyframes drop-bob {
      0%, 100% { transform: translate(-50%, -50%)             rotate(0deg); }
      50%      { transform: translate(-50%, calc(-50% - 6px)) rotate(.6deg); }
    }
    @keyframes drop-out {
      to { opacity: 0; transform: translate(-50%, calc(-50% + 40px)) rotate(6deg) scale(.92); }
    }
    @keyframes caption-rise {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes bars {
      0%, 100% { transform: scaleY(.5); }
      50%      { transform: scaleY(1); }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="./overlay.js"></script>
</body>
</html>
