<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MemeDrop overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    #stage {
      position: fixed; inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .anchor {
      position: absolute;
      width: 0; height: 0;
    }

    .drop {
      position: absolute;
      left: 0; top: 0;
      transform-origin: center;
      will-change: transform, opacity;
      filter:
        drop-shadow(0 30px 60px rgba(0,0,0,.55))
        drop-shadow(0 6px 12px rgba(0,0,0,.4));
      opacity: 0;
      animation:
        drop-in   420ms cubic-bezier(.18,1.2,.4,1) forwards,
        drop-bob  3s ease-in-out 420ms infinite;
    }

    .drop.leaving {
      animation: drop-out 380ms cubic-bezier(.5,0,.75,0) forwards;
    }

    /* The media wrapper — establishes the box the caption aligns to */
    .media-box {
      position: relative;
      display: inline-block;
      line-height: 0;             /* kill inline gap under media */
    }

    .drop img,
    .drop video,
    .media-box > div > svg,
    .media-box > div > div > svg {
      display: block;
      max-width: 38vw;
      max-height: 50vh;
      width: auto;
      height: auto;
      border-radius: 14px;
      background: #000;
    }

    /* Small username tag above the meme */
    .tag {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translate(-50%, -100%);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      color: #fff;
      background: linear-gradient(135deg, #ff5e8a, #ffb45e);
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      z-index: 3;
    }

    /* Caption — full-width subtitle bar at the bottom of the media,
       TikTok/MrBeast style. White bold text, black outline, centered,
       wraps onto multiple lines, never crops. */
    .caption-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      width: 100%;
      padding: 10px 14px 14px;
      font-family: 'Impact', 'Arial Black', 'Anton', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(18px, 2.6vw, 40px);
      line-height: 1.08;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-align: center;
      color: #fff;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      /* heavy black outline for readability over any image */
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow:
        0 2px 4px rgba(0,0,0,.9),
        0 0 10px rgba(0,0,0,.7);
      /* subtle gradient scrim so text stays legible on bright images */
      background: linear-gradient(to top,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.35) 55%,
        rgba(0,0,0,0) 100%);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 2;
      animation: caption-rise 420ms cubic-bezier(.18,1.1,.4,1) 160ms backwards;
    }

    @keyframes drop-in {
      0%   { opacity: 0; transform: translate(-50%, calc(-50% - 80px)) rotate(-8deg) scale(.6); }
      60%  { opacity: 1; transform: translate(-50%, calc(-50% + 12px)) rotate( 2deg) scale(1.04); }
      100% { opacity: 1; transform: translate(-50%, -50%)              rotate( 0deg) scale(1);    }
    }
    @keyframes drop-bob {
      0%, 100% { transform: translate(-50%, -50%)             rotate(0deg); }
      50%      { transform: translate(-50%, calc(-50% - 6px)) rotate(.6deg); }
    }
    @keyframes drop-out {
      to { opacity: 0; transform: translate(-50%, calc(-50% + 40px)) rotate(6deg) scale(.92); }
    }
    @keyframes caption-rise {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="./overlay.js"></script>
</body>
</html>
